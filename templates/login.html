<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>MF Tech - OSINT · Acceso</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cascadia Code", Consolas, "Courier New", monospace;
      background: radial-gradient(900px 500px at 20% -10%, rgba(0,224,141,0.07), transparent 60%), radial-gradient(900px 500px at 80% -10%, rgba(0,194,255,0.07), transparent 60%), #05070d;
      color: #d2ece4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay;
    }
    .card {
      position: relative;
      max-width: 420px;
      width: 100%;
      background: #0a0f1a;
      border: 1px solid #1e2a44;
      padding: 30px;
      box-shadow: 0 0 0 1px rgba(0,224,141,0.08), 0 12px 40px rgba(0,0,0,.5);
      clip-path: polygon(0 16px, 16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px));
    }
    .card::before {
      content: "";
      position: absolute; top: -1px; left: -1px;
      width: 30px; height: 30px;
      border-top: 2px solid #00e08d;
      border-left: 2px solid #00e08d;
    }
    .card::after {
      content: "";
      position: absolute; bottom: -1px; right: -1px;
      width: 30px; height: 30px;
      border-bottom: 2px solid #00c2ff;
      border-right: 2px solid #00c2ff;
    }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #00e08d, #00c2ff);
      clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
      display: grid; place-items: center;
      color: #02140c; font-weight: 800; letter-spacing: 1px;
      box-shadow: 0 0 18px rgba(0,224,141,0.35);
    }
    h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg,#00e08d,#00c2ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1::after { content: "\258B"; color: #00e08d; margin-left: 6px; -webkit-text-fill-color: #00e08d; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .sub { color: #71859f; font-size: 12px; letter-spacing: 1px; margin-bottom: 22px; }
    .lbl { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #71859f; margin: 14px 0 6px; }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #1e2a44;
      background: #0b1220;
      color: #d2ece4;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      caret-color: #00e08d;
    }
    input:focus { border-color: #00e08d; box-shadow: 0 0 0 3px rgba(0,224,141,.12); }
    .err {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(255,92,92,.1);
      border: 1px solid #ff5c5c;
      color: #ff9b9b;
      font-size: 12px;
    }
    .hint {
      margin: 8px 0 0;
      color: #55667c;
      font-size: 11px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, #00e08d, #00c2ff);
      color: #02140c;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
      box-shadow: 0 0 20px rgba(0,224,141,0.3);
    }
    button:hover { box-shadow: 0 0 26px rgba(0,224,141,0.5); }
    button:disabled { opacity: .5; cursor: default; }
    footer { margin-top: 20px; font-size: 11px; color: #55667c; text-align: center; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top"><span class="logo">MF</span><h1>MF Tech - OSINT</h1></div>
    <p class="sub">Acceso restringido: admin o clientes con licencia asignada</p>

    <form id="loginForm" autocomplete="on">
      <label class="lbl" for="user">Usuario</label>
      <input type="text" id="user" autocomplete="username" autofocus>
      <label class="lbl" for="pass">Contrase&ntilde;a o clave de licencia</label>
      <input type="password" id="pass" autocomplete="current-password">
      <p class="hint">Clientes: us&aacute; el usuario y la clave de licencia que te asignaron (formato XXXX-XXXX-XXXX-XXXX) en el campo &ldquo;Contrase&ntilde;a o clave de licencia&rdquo;.</p>
      <div id="err" class="err" style="display:none"></div>
      <button type="submit" id="btnLogin">Ingresar</button>
    </form>

    <footer>Uso autorizado &middot; Edici&oacute;n servidor &mdash; clientes con licencia</footer>
  </div>

  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var errEl = document.getElementById("err");
      var btn = document.getElementById("btnLogin");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        btn.disabled = true;
        errEl.style.display = "none";
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usuario: document.getElementById("user").value,
            clave: document.getElementById("pass").value
          })
        }).then(function (r) {
          return r.json().then(function (d) { return { ok: r.ok, data: d }; });
        }).then(function (res) {
          btn.disabled = false;
          if (res.ok) { window.location.href = "/"; return; }
          errEl.textContent = res.data.error || "Credenciales incorrectas.";
          errEl.style.display = "block";
        }).catch(function () {
          btn.disabled = false;
          errEl.textContent = "Error de red. Probá de nuevo.";
          errEl.style.display = "block";
        });
      });
    })();
  </script>
</body>
</html>
